# Dante SOCKS5 server for routehouse.
# Clients connect here; outbound traffic is automatically steered through the
# correct VPN by the same kernel policy routing (fwmark + ip rule) that squid uses.
# No per-VPN config is needed — routing is transparent.

logoutput: syslog

user.privileged:    root
user.notprivileged: nobody

# debug: 1 keeps danted in the foreground, required for supervisord tracking.
debug: 1

# Listen on all interfaces, standard SOCKS port.
internal: 0.0.0.0 port=1080

# Outbound interface for new connections. Kernel policy routing handles the rest.
# In Docker this is almost always eth0; adjust if your setup differs.
external: eth0

# No client-side or SOCKS-level authentication.
clientmethod: none
socksmethod:  none

# ── Access control ────────────────────────────────────────────────────────────
# Allow access from RFC 1918, link-local, and localhost only (mirrors squid ACLs).

client pass {
    from: 127.0.0.0/8 to: 0.0.0.0/0
}

client pass {
    from: 10.0.0.0/8 to: 0.0.0.0/0
}

client pass {
    from: 172.16.0.0/12 to: 0.0.0.0/0
}

client pass {
    from: 192.168.0.0/16 to: 0.0.0.0/0
}

client pass {
    from: 169.254.0.0/16 to: 0.0.0.0/0
}

client block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

# Forward to any destination; kernel routing takes it from here.
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}
