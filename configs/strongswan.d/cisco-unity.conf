# Advertise the Cisco Unity vendor ID on IKEv1 so gateways that speak the
# Cisco/EzVPN dialect (Cisco ASA, Juniper, MikroTik, etc.) will push their
# split-include subnet list during Mode Config. charon's unity plugin then
# narrows our 0.0.0.0/0 request to exactly those subnets and fires the updown
# script once per pushed subnet -- giving us the same peer-supplied routes a
# MikroTik shows as dynamic policies, with no manual_routes to maintain.
#
# Harmless for non-Cisco peers: they simply ignore the extra vendor ID and the
# UNITY_SPLIT_INCLUDE request, and we keep the full-tunnel 0.0.0.0/0 selector.
charon {
    cisco_unity = yes
}
