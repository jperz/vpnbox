# Routehouse BIRD2 config
# Per-VPN exported routes are written to /data/bird/vpn-<name>.conf
# by vpn.sh on connect and removed on disconnect. BIRD is reloaded each time.

router id from "eth0";

log syslog all;

protocol device { }

protocol kernel {
    ipv4 {
        export none;
        import none;
    };
}

# Dynamically populated by vpn.sh for VPNs with exported_routes
include "/data/bird/*.conf";

protocol rip routehouse_rip {
    ipv4 {
        # Export only routes from per-VPN static protocols (named vpn_*)
        export filter { if proto ~ "vpn_*" then accept; reject; };
        import none;
    };
    interface "eth*" {
        version 2;
        authentication none;
    };
}
